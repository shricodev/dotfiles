---
config_dir: "{{ ansible_facts['user_dir'] }}/.config"
dotfiles_dir: "{{ ansible_facts['user_dir'] }}/.dotfiles"

dotfiles_repo: "https://github.com/shricodev/dotfiles.git"

# Stow packages that must never have their directories folded into a single
# symlink. These target directories the application also writes its own state
# into, so a folded symlink would make that state land inside the dotfiles repo.
# Keep in sync with NO_FOLDING_PACKAGES in stow.sh.
stow_no_folding_packages:
  - kdenlive

ansible_user: "shricodev"

go:
  packages:
    - package: github.com/air-verse/air@latest
      cmd: air

    - package: github.com/melkeydev/go-blueprint@latest
      cmd: go-blueprint

    - package: github.com/pressly/goose/v3/cmd/goose@latest
      cmd: goose

    - package: github.com/rakyll/hey@latest
      cmd: hey

    - package: github.com/joshmedeski/sesh@latest
      cmd: sesh

    - package: github.com/spf13/cobra-cli@latest
      cmd: cobra-cli

    - package: github.com/goreleaser/goreleaser/v2@latest
      cmd: goreleaser
